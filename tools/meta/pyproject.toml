[project]
name = "meta"
version = "0.1.0"
description = "A small helper tool for generating Bazel build files from tagged upstream releases."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.27.2",
]

[project.scripts]
meta = "meta.cli:app"

[build-system]
requires = ["uv_build>=0.11.16,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
