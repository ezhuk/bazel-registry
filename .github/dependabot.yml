version: 2
multi-ecosystem-groups:
  all:
    schedule:
      interval: "monthly"
updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all"
  - package-ecosystem: "pre-commit"
    cooldown:
      default-days: 7
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "all"
