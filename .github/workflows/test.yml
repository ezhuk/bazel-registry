# test.yml

name: test

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
  push:
    branches: [main]

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        module:
          - fizz
          - folly
          - libaegis
          - liboqs
          - mvfst
          - proxygen
          - wangle

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: |
          bazel build //:test \
            --registry=file://${{ github.workspace }} \
            --registry=https://bcr.bazel.build
          if [[ "${{ matrix.module }}" == "fizz" || "${{ matrix.module }}" == "folly" || "${{ matrix.module }}" == "mvfst" || "${{ matrix.module }}" == "proxygen" || "${{ matrix.module }}" == "wangle" ]]; then
            bazel test -k //:tests \
              --registry=file://${{ github.workspace }} \
              --registry=https://bcr.bazel.build
          fi
        working-directory: tests/${{ matrix.module }}
