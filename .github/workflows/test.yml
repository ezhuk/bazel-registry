name: test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      matrix:
        module:
          - fizz
          - folly
          - libaegis
          - liboqs
          - mvfst
          - proxygen
          - wangle
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: |
          bazel build //:test \
            --registry=file://${{ github.workspace }} \
            --registry=https://bcr.bazel.build
          if [[ "${{ matrix.module }}" == "fizz" || "${{ matrix.module }}" == "folly" || "${{ matrix.module }}" == "mvfst" || "${{ matrix.module }}" == "proxygen" || "${{ matrix.module }}" == "wangle" ]]; then
            bazel test -k //:tests \
              --registry=file://${{ github.workspace }} \
              --registry=https://bcr.bazel.build
          fi
        working-directory: tests/${{ matrix.module }}
